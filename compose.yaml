services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ter_db
      POSTGRES_USER: ter_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ter_user -d ter_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # "db" = nom du service, résolu par le réseau interne de Compose
      ConnectionStrings__Default: Host=db;Port=5432;Database=ter_db;Username=ter_user;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Admin__Email: ${ADMIN_EMAIL:-admin@crous.local}
      Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}

    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  postgres_data: