services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ter_db
      POSTGRES_USER: ter_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ter_user -d ter_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: